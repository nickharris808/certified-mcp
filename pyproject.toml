[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certified-mcp"
version = "1.0.0"
description = "MCP server giving AI agents a verifier they cannot argue with — certificates, proofs, and sealed criteria"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Nicholas Harris" }]
keywords = ["mcp", "model-context-protocol", "agents", "verification", "certificates", "formal-methods"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
dependencies = ["lcert-verify>=1.0.0", "equiv-receipt>=1.0.0", "prereg-seal>=1.0.0", "cert-atlas>=1.0.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
certified-mcp = "certified_mcp.server:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
